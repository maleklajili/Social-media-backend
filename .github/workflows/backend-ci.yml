name: Backend CI

# Intégration continue du backend (Bun/TypeScript + IA) — gratuit, aucun secret.
# Pipeline en 2 étapes (jobs) : lint -> construction de l'image Docker.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # 1) Qualité : installation des dépendances + lint ESLint
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Analyse ESLint
        run: bun run lints || true

  # 2) Conteneurisation : build de l'image Docker (sans publication)
  docker:
    name: Build image Docker
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t cvtech-backend:ci .
