<!doctype html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @page {
        size: A4;
        margin: 0.75in;
      }
      * {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Calibri", "Segoe UI", Arial, sans-serif;
        font-size: 10pt;
        color: #333;
        line-height: 1.5;
      }

      /* Header */
      .header-table {
        width: 100%;
        margin-bottom: 12pt;
        border-bottom: 1pt solid #e2e8f0;
        padding-bottom: 9pt;
      }
      .header-info {
        vertical-align: top;
      }
      .header-photo {
        width: 100pt;
        text-align: right;
        vertical-align: top;
      }
      .photo-box {
        width: 86pt;
        height: 108pt;
        border: 2pt solid #0f766e;
        border-radius: 4pt;
        text-align: center;
        vertical-align: middle;
        font-size: 8pt;
        color: #6b7280;
      }
      .photo-img {
        width: 86pt;
        height: 108pt;
        border: 2pt solid #0f766e;
        border-radius: 4pt;
      }
      .name {
        font-size: 22pt;
        font-weight: bold;
        color: #1f2937;
        margin-bottom: 3pt;
      }
      .title {
        font-size: 13pt;
        color: #0f766e;
        font-weight: 500;
        margin-bottom: 6pt;
      }
      .contact-info {
        font-size: 10pt;
        color: #6b7280;
        line-height: 1.3;
      }

      /* Section */
      .section {
        margin-bottom: 10pt;
      }
      .section-title {
        font-size: 12pt;
        font-weight: bold;
        color: #0f766e;
        border-bottom: 2pt solid #0f766e;
        padding-bottom: 3pt;
        margin-bottom: 6pt;
      }

      /* Summary */
      .summary {
        color: #4b5563;
        font-size: 10pt;
        line-height: 1.4;
      }

      /* Entry */
      .entry {
        margin-bottom: 6pt;
        font-size: 10pt;
      }
      .entry-table {
        width: 100%;
      }
      .position {
        font-weight: 600;
        color: #1f2937;
        font-size: 10pt;
      }
      .dates {
        color: #6b7280;
        font-size: 9pt;
        text-align: right;
      }
      .company-school {
        color: #6b7280;
        font-size: 9.5pt;
      }
      .description {
        color: #4b5563;
        margin-top: 2pt;
        font-size: 9.5pt;
      }

      /* Skills */
      .skills-list {
        font-size: 9.5pt;
        color: #4b5563;
        line-height: 1.5;
      }
      .skill-label {
        font-weight: bold;
        color: #1f2937;
      }

      /* Languages */
      .lang-item {
        margin-bottom: 3pt;
        font-size: 10pt;
      }
      .lang-name {
        font-weight: bold;
        color: #1f2937;
      }
      .lang-level {
        color: #6b7280;
        font-size: 9pt;
      }

      /* Items */
      .item {
        font-size: 9.5pt;
        color: #4b5563;
        margin-bottom: 2pt;
      }
    </style>
  </head>
  <body>
    <!-- Header with Photo -->
    <table class="header-table" cellpadding="0" cellspacing="0">
      <tr>
        <td class="header-info">
          <div class="name">malek</div>

          <div class="title">ingénieur</div>

          <div class="contact-info">
            tunis<br />
            90044835<br />
            malekajili714@gmail.com<br />
          </div>
        </td>
        <td class="header-photo">
          <div class="photo-box">[Photo<br />identité<br />4x5 cm]</div>
        </td>
      </tr>
    </table>

    <!-- Profil Personnel -->

    <!-- Expérience Professionnelle -->

    <div class="section">
      <div class="section-title">EXPÉRIENCE PROFESSIONNELLE</div>

      <div class="entry">
        <table class="entry-table" cellpadding="0" cellspacing="0">
          <tr>
            <td><span class="position">proservice</span></td>
            <td><span class="dates">2022-03 - Présent</span></td>
          </tr>
        </table>

        <div class="company-school">tvhh</div>
      </div>
    </div>

    <!-- Formation -->

    <div class="section">
      <div class="section-title">FORMATION</div>

      <div class="entry">
        <table class="entry-table" cellpadding="0" cellspacing="0">
          <tr>
            <td><span class="position">oca</span></td>
            <td><span class="dates">2020-01 - Présent</span></td>
          </tr>
        </table>

        <div class="company-school">tekup</div>
      </div>
    </div>

    <!-- Compétences -->

    <!-- Langues -->

    <div class="section">
      <div class="section-title">LANGUES</div>

      <div class="lang-item">
        <span class="lang-name">arabe</span>
        <span class="lang-level"> C2</span>
      </div>

      <div class="lang-item">
        <span class="lang-name">fr</span>
        <span class="lang-level"> B1</span>
      </div>
    </div>

    <!-- Projets -->

    <div class="section">
      <div class="section-title">PROJETS</div>

      <div class="entry">
        <span class="position">cvtech</span>
      </div>
    </div>

    <!-- Certifications -->

    <div class="section">
      <div class="section-title">CERTIFICATIONS</div>

      <div class="item">&bull; ccna</div>
    </div>

    <!-- Intérêts -->

    <div class="section">
      <div class="section-title">INTÉRÊTS</div>
      <div class="item">animaux</div>
    </div>
  </body>
</html>
